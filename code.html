<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    header{
        background-color: rgb(17, 17, 17);
        color: rgb(251, 249, 249);
        height: 150px;
        text-align: center;
    }
    h1{
        margin:0%;
        padding: 30px;
    }
    .nav{
        background-color: #41413f;
        color:white;
        display: flex;
        justify-content: space-around;
        font-size: 20px;
    }
    .main{
        display: grid;
        grid-template-columns: 75% 25%;
    }
    .left{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        background-color: #b8b5b5;
        text-align: center;
    }
    .box{
        height: 300px;
        background-color: #3e3c3c;
        border:  1px solid #000;

        display: flex;
        justify-content: center;    
        align-items: center;
    }
    .content{
        grid-column: 1/4;
        height: 200px;
        background-color: #3e3c3c;
        border:  1px solid #000;

        display: flex;
        justify-content: center;    
        align-items: center;
    }
    .sidebar{
        grid-column: 2/3;
        background-color: #b8b5b5;
        border:  1px solid #000;

        display: flex;
        justify-content: center;
        align-items: center;
    }
    .footer{
        background:#0a0c0f;
        height: 50px;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    </style> 
</head>
<body>
    <header>
        <h1>Header Element</h1>
     <div class="nav">   
        <div>HOME</div>
        <div>ABOUT</div>
        <div>CONTACT</div>
     </div>
    </header>  
    <div class="main">
        <div class="left">
            <div class="box">SmallBox1</div>
            <div class="box">SmallBox2</div>
            <div class="box">SmallBox3</div>
            <div class="content">
                Main Content
            </div>
        </div>

        <div class="sidebar">
            side bar
        </div>    

    </div>
    <div class="footer">
        Footer Element
    </div>
</body>
</html>
