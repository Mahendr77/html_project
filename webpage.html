<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
}

/* Header */

.header{
    background:#0D47A1;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
}

.logo{
    color:white;
    font-size:32px;
    font-weight:bold;
}

.logo span{
    color:yellow;
}

.search input[type=text]{
    width:350px;
    padding:10px;
    font-size:16px;
}

.search input[type=submit]{
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
}

.menu{
    color:white;
    font-size:20px;
    font-weight:bold;
}

/* Categories */

.category{
    background:#1976D2;
    display:flex;
    justify-content:space-around;
    padding:18px;
    color:white;
    font-size:20px;
    font-weight:bold;
}

</style>

</head>

<div class="logo">

</div>

</div>
